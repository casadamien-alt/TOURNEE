<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ma tournée scolaire</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#f2b705">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f6f4ef; --card:#fff; --ink:#1f2a2e; --mute:#6b7478; --line:#e4e0d6;
  --brand:#f2b705; --brand-ink:#3a2c00; --brand-soft:#fff6d6;
  --go:#1f7a5a; --go-bg:#e3f3ec; --call:#1d5fd1; --sms:#7a3fd1; --warn:#b4471f; --off:#c9c4b8;
  --night:#2b3561; --night-soft:#e7e9f6;
  --r:16px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Nunito,system-ui,-apple-system,Segoe UI,sans-serif;font-size:16px}
body{padding:env(safe-area-inset-top) env(safe-area-inset-right) calc(88px + env(safe-area-inset-bottom)) env(safe-area-inset-left)}
button,input,select,textarea{font:inherit;color:inherit}
header{position:sticky;top:0;z-index:5;background:var(--brand);color:var(--brand-ink);padding:12px 16px;box-shadow:0 2px 0 rgba(0,0,0,.06)}
header.night{background:var(--night);color:#fff}
header h1{margin:0;font-size:20px;font-weight:900;display:flex;align-items:center;gap:8px}
header .sub{font-size:13px;font-weight:700;opacity:.85;margin-top:2px}
.status{font-size:12px;opacity:.75;font-weight:700;margin-left:auto}
main{padding:14px 14px 20px;max-width:720px;margin:0 auto}
.card{background:var(--card);border-radius:var(--r);border:1px solid var(--line);padding:14px;margin-bottom:12px}
.muted{color:var(--mute)} .small{font-size:13px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.grow{flex:1;min-width:0}
.btn{border:1px solid var(--line);background:#fff;border-radius:12px;padding:9px 12px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.go{background:var(--go);color:#fff;border-color:var(--go)}
.btn.brand{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.night{background:var(--night);border-color:var(--night);color:#fff}
.btn.call{color:var(--call)} .btn.sms{color:var(--sms)} .btn.danger{color:var(--warn)}
.btn.callf{background:var(--call);border-color:var(--call);color:#fff}
.btn.smsf{background:var(--sms);border-color:var(--sms);color:#fff}
.btn.sm{padding:6px 10px;font-size:14px;border-radius:10px}
.btn.lg{padding:15px;font-size:17px;border-radius:14px;width:100%}
.btn:disabled{opacity:.4;cursor:default}
.w100{width:100%}
label.f{display:block;font-size:13px;font-weight:800;color:var(--mute);margin:10px 0 4px}
input.t,select.t,textarea.t{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;background:#fff}
textarea.t{min-height:64px;resize:vertical}
h2{margin:0 0 8px;font-size:21px} h3{margin:2px 0 8px;font-size:17px}
.name{font-weight:900;font-size:18px}
.addr{font-size:14px;color:var(--mute);margin-top:2px}
.pill{font-size:12px;font-weight:800;border-radius:999px;padding:2px 9px;background:#eee;white-space:nowrap}
.pill.m{background:var(--brand-soft);color:#7a5a00} .pill.s{background:var(--night-soft);color:var(--night)}
.pill.ok{background:var(--go-bg);color:var(--go)}
.com{font-size:14px;border-radius:10px;padding:7px 10px;margin-top:8px;background:var(--brand-soft)}
.com.s{background:var(--night-soft)}
.chk{appearance:none;-webkit-appearance:none;width:34px;height:34px;border-radius:10px;border:2px solid var(--off);background:#fff;flex:none;cursor:pointer;display:grid;place-items:center}
.chk:checked{background:var(--go);border-color:var(--go)}
.chk:checked::after{content:"";width:10px;height:17px;border:solid #fff;border-width:0 4px 4px 0;transform:rotate(45deg) translate(-1px,-2px)}
.pick{display:flex;gap:12px;align-items:center}
.pick.off{opacity:.5}
.num{width:30px;height:30px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:900;font-size:14px;flex:none}
.tabs{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);display:flex;padding:6px 6px calc(6px + env(safe-area-inset-bottom));z-index:6}
.tabs button{flex:1;border:0;background:none;padding:6px;border-radius:12px;font-weight:800;font-size:13px;color:var(--mute);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button .i{font-size:22px;line-height:1}
.tabs button.on{color:var(--ink);background:var(--brand-soft)}
.empty{text-align:center;padding:30px 16px}
.empty .big{font-size:44px}
.sheet-bg{position:fixed;inset:0;background:rgba(20,25,28,.45);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:720px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom))}
.msgbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px;white-space:pre-wrap;font-size:14px}
.toast{pointer-events:none;position:fixed;left:50%;bottom:100px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:12px;font-weight:800;z-index:30;max-width:90vw;text-align:center}
.contact{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.ord{display:flex;flex-direction:column;gap:4px}
.ord button{width:36px;height:30px;border-radius:8px;border:1px solid var(--line);background:#fff;cursor:pointer;font-weight:900}
.banner{background:var(--go);color:#fff;border-radius:var(--r);padding:14px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
/* tournée en cours */
.timer{display:flex;gap:10px;align-items:stretch;margin-bottom:12px}
.timer>div{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.timer b{display:block;font-size:24px;line-height:1.15}
.step{position:relative}
.step.done{background:#f3faf6;border-color:#bfe3d2}
.step.current{border:2px solid var(--brand);box-shadow:0 4px 16px rgba(242,183,5,.25)}
.step.night.current{border-color:var(--night);box-shadow:0 4px 16px rgba(43,53,97,.2)}
.step.later{opacity:.75}
.validate{display:flex;align-items:center;gap:10px;width:100%;border:2px solid var(--go);background:#fff;color:var(--go);border-radius:14px;padding:12px;font-weight:900;font-size:17px;cursor:pointer;justify-content:center;margin-top:10px}
.validate{flex-direction:column;gap:2px;text-align:center}
.arrive{text-align:center;padding:8px 4px 4px}
.arrive .big{font-size:56px;line-height:1.1}
.arrive h2{font-size:26px;margin:6px 0 4px}
.arrive-ok{display:block;width:100%;margin-top:18px;padding:26px 14px;font-size:21px;border-radius:18px;text-align:center}
.validate.on{background:var(--go);color:#fff}
.doneline{display:flex;align-items:center;gap:8px;color:var(--go);font-weight:900}
.mic{position:fixed;right:16px;bottom:calc(96px + env(safe-area-inset-bottom));width:62px;height:62px;border-radius:50%;border:0;background:var(--ink);color:#fff;font-size:28px;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:7;cursor:pointer}
.help{position:fixed;left:16px;bottom:calc(96px + env(safe-area-inset-bottom));height:56px;padding:0 18px;border-radius:28px;border:0;background:#d1342f;color:#fff;font-weight:900;font-size:18px;box-shadow:0 6px 18px rgba(209,52,47,.35);z-index:7;cursor:pointer;display:flex;align-items:center;gap:6px}
body.running main{padding-bottom:90px}
.helpcard{display:flex;gap:12px;align-items:center}
.helpcard .who{flex:1;min-width:0}
.hf{position:fixed;right:16px;bottom:calc(168px + env(safe-area-inset-bottom));height:40px;padding:0 14px;border-radius:20px;border:1px solid var(--line);background:#fff;font-weight:900;font-size:14px;z-index:7;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.hf.on{background:var(--go);color:#fff;border-color:var(--go);animation:pulsego 1.6s infinite}
@keyframes pulsego{0%{box-shadow:0 0 0 0 rgba(31,122,90,.5)}100%{box-shadow:0 0 0 14px rgba(31,122,90,0)}}
.micq{position:fixed;right:84px;bottom:calc(104px + env(safe-area-inset-bottom));width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:#fff;font-weight:900;font-size:18px;z-index:7;cursor:pointer;box-shadow:0 3px 10px rgba(0,0,0,.12)}
.mic.on{background:#d1342f;animation:pulse 1.2s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(209,52,47,.5)}100%{box-shadow:0 0 0 18px rgba(209,52,47,0)}}
.heard{position:fixed;left:14px;right:14px;bottom:calc(218px + env(safe-area-inset-bottom));background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px;z-index:7;font-weight:700;box-shadow:0 6px 18px rgba(0,0,0,.12)}
/* historique */
.hist{display:flex;gap:10px;align-items:center;cursor:pointer}
.hist .d{width:48px;text-align:center;flex:none}
.hist .d b{display:block;font-size:20px;line-height:1}
.hist .dur{font-weight:900;font-size:18px;white-space:nowrap}
.tot{display:flex;gap:10px;margin-bottom:12px}
.tot>div{flex:1;background:#fff;border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.tot b{display:block;font-size:22px}
table.steps{width:100%;border-collapse:collapse;font-size:14px;margin-top:8px}
table.steps td{padding:5px 2px;border-top:1px solid var(--line)}
table.steps td:last-child{text-align:right;font-weight:800}
.ocr{background:#fff3bf !important;border-color:#e0b100 !important}
.vide{background:#fdecec !important;border:2px dashed #d64545 !important}
.vide::placeholder{color:#c03030;font-weight:800;opacity:1}
.bar{height:7px;background:#ece7da;border-radius:4px;overflow:hidden;margin:5px 0}
.bar i{display:block;height:100%;background:#f2b705;transition:width .3s}
label.btn{cursor:pointer;text-align:center}
input[type=time].tm{border:1px solid var(--line);border-radius:10px;padding:6px 8px;background:#fff;font-weight:800}
</style>
</head>
<body>
<header id="hdr"></header>
<main id="main"></main>
<nav class="tabs" id="tabs">
  <button data-v="tournees"><span class="i">🚐</span>Tournées</button>
  <button data-v="familles"><span class="i">📇</span>Familles</button>
  <button data-v="historique"><span class="i">🕓</span>Historique</button>
  <button data-v="carburant"><span class="i">⛽</span>Carburant</button>
  <button data-v="reglages"><span class="i">⚙️</span>Réglages</button>
</nav>
<div id="voiceRoot"></div>
<div id="helpRoot"></div>
<div id="sheetRoot"></div>

<script>
/* =========================================================
   Modèle de données
   ========================================================= */
const LS_KEY = "tournee-scolaire-v2";
const LS_HIST = "tournee-scolaire-hist-v2";
const LIENS = ["Mère","Père","Représentant légal","Tuteur / tutrice","Famille d'accueil","Éducateur / référent","Grand-mère","Grand-père","Grand-parent","Assistante maternelle / nounou","Frère / sœur","Oncle / tante","Voisin(e)"];
const TYPES_TEL = ["Portable","Fixe","Travail"];
function contactLabel(c){ return [c.lien || "Contact", c.nom].filter(Boolean).join(" – ") + (c.type && c.type !== "Portable" ? ` (${c.type.toLowerCase()})` : ""); }
const DEFAULT_TPL = {
  avantMatin: "Bonjour, c'est {chauffeur}, chauffeur du transport de {enfant}. Je passerai vers {heure}.",
  valideMatin: "Bonjour, {enfant} est bien monté(e) dans le véhicule à {heure}. Bonne journée ! {chauffeur}",
  avantSoir: "Bonjour, c'est {chauffeur}. J'arrive avec {enfant} dans une dizaine de minutes.",
  valideSoir: "Bonjour, {enfant} a bien été déposé(e) à {heure}. Bonne soirée ! {chauffeur}",
  devant: "Bonjour, je suis devant chez vous pour {enfant}. {chauffeur}"
};
const TPL_LABELS = {
  avantMatin: "Aller – avant le ramassage",
  valideMatin: "Aller – enfant pris en charge (étape validée)",
  avantSoir: "Retour – j'arrive bientôt",
  valideSoir: "Retour – enfant déposé (étape validée)",
  devant: "« Je suis devant chez vous »"
};
function blankState(){ return { v:2, chauffeur:"", tpl:{...DEFAULT_TPL}, tournees:[], active:null, next:null, domicile:"", pleins:[], vehicules:[], societes:[], depenses:[], depTypes:["Péage","Parking","Lavage"] }; }

let S = blankState();
let H = {};                 // historique : { "2026-11": [entrées] }
let view = "tournees";      // tournees | historique | reglages
let retourSel = "";          // jour de la semaine choisi dans la fiche (« » = tous les jours)
function dateDuJour(wd){ return addDays(mondayOf(dayKey(new Date())), (wd + 6) % 7); }   // une date de ce jour de la semaine
let sub = null;             // null | {type:"edit", id} | {type:"prep", id, sens, present:[]}
let histMonth = monthKey(new Date());
let openHist = null;

/* ---------- utilitaires ---------- */
function uid(){ return Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c])); }
function p2(n){ return String(n).padStart(2,"0"); }
function dayKey(d){ d = new Date(d); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate()); }
function monthKey(d){ d = new Date(d); return d.getFullYear()+"-"+p2(d.getMonth()+1); }
function hm(iso){ if(!iso) return "—"; const d = new Date(iso); return p2(d.getHours())+"h"+p2(d.getMinutes()); }
function hmInput(iso){ const d = new Date(iso); return p2(d.getHours())+":"+p2(d.getMinutes()); }
function durTxt(min){ min = Math.max(0, Math.round(min)); const h = Math.floor(min/60), m = min%60; return h ? `${h} h ${p2(m)}` : `${m} min`; }
function minsBetween(a,b){ return (new Date(b) - new Date(a)) / 60000; }
const JOURS = ["dim.","lun.","mar.","mer.","jeu.","ven.","sam."];
const MOIS = ["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
function moisTxt(mk){ const [y,m] = mk.split("-").map(Number); return MOIS[m-1]+" "+y; }
function hTxt(v){ return v ? v.replace(":","h") : ""; }
const JOURS_LONG = ["dimanche","lundi","mardi","mercredi","jeudi","vendredi","samedi"];
function horaire(e, d){ const h = ((e && e.horaires) || {})[new Date(d).getDay()] || {}; return { debut:h.debut||"", fin:h.fin||"" }; }
function hasHoraires(e){ return Object.values((e && e.horaires)||{}).some(h => h && (h.debut || h.fin)); }
function etabHoraires(e){ const h = horaire(e, new Date()); return (h.debut||h.fin) ? `🕗 Aujourd'hui ${hTxt(h.debut)||"?"} → ${hTxt(h.fin)||"?"}` : ""; }
function remplActif(t, dk){
  const r = t?.remplacement; if (!r || !r.actif || !r.nom) return false;
  dk = dk || dayKey(new Date());
  return (!r.du || dk >= r.du) && (!r.au || dk <= r.au);
}
function dFr(dk){ return dk ? dk.split("-").reverse().join("/") : ""; }
// absences prévues : {id, du, au, sens: "both" (toute la journée) | tableau de courses ["matin","midi"] | "matin" | "soir", motif}
function sessionsOf(s){ return s === "both" ? ["matin","midi","soir"] : Array.isArray(s) ? s : [s]; }
function absentPrevu(k, dk, sens){
  return (k.absences||[]).find(x => x.du && dk >= x.du && dk <= (x.au || x.du) && sessionsOf(x.sens).includes(sens)) || null;
}
// courses prévues par jour : k.plan[0..6] = {matin, midi, soir, hMatin, hMidi, hSoir} (0 = dimanche)
const JOURS_PLAN = [1,2,3,4,5,6,0];
function planOf(k){
  if (k.plan && typeof k.plan === "object") return k.plan;
  const p = {};   for (let d = 0; d < 7; d++){ const semaine = d >= 1 && d <= 5;   // fiches anciennes : lundi à vendredi seulement, samedi et dimanche décochés
    p[d] = { matin: semaine && k.matin !== false, midi: semaine && k.midi === true, soir: semaine && k.soir !== false, hMatin: k.heureMatin || "", hMidi: "12:00", hSoir: "" }; }
  return p;
}
function dayPlan(k, dk){ return planOf(k)[new Date((dk || dayKey(new Date())) + "T12:00:00").getDay()] || {}; }
function altDaysTxt(x, gen){
  const f = arr => (arr||[]).slice().sort().map(d => JOURS_LONG[d]).join(", ");
  const j = [x.matin?.length ? "☀️ matin : " + f(x.matin) + ((x.heureMatin || gen) ? " à " + (x.heureMatin || gen).replace(":", "h") : "") : "", x.soir?.length ? "🌙 soir : " + f(x.soir) : ""].filter(Boolean).join(" · ") || "aucun jour choisi";
  if (!x.alterne) return j;
  const td = dayKey(new Date());
  return `${j} · <b>une semaine sur deux</b> (${altWeekOn(x, td) ? "dont cette semaine" : "pas cette semaine, la suivante oui"})`;
}
function absTxt(x){
  const per = x.au && x.au !== x.du ? `du ${dFr(x.du)} au ${dFr(x.au)}` : `le ${dFr(x.du)}`;
  const ss = sessionsOf(x.sens);
  const tr = ss.length >= 3 ? " · toute la journée" : " · " + ss.map(sensNom).join(" + ");
  return per + tr + (x.motif ? " — " + x.motif : "");
}
function tour(id){ return S.tournees.find(t => t.id === id); }
// sauvegarde de l'ordre précédent avant chaque « garder » : un seul retour arrière possible
function snapOrdre(t){
  t.ordrePrec = { ordreSoir: Array.isArray(t.ordreSoir) ? t.ordreSoir.slice() : null,
    ordreRetour: Array.isArray(t.ordreRetour) ? t.ordreRetour.slice() : null,
    retourJour: t.retourJour ? JSON.parse(JSON.stringify(t.retourJour)) : null };
}
function restaurerOrdre(t){
  const p = t.ordrePrec; if (!p) return false;
  t.ordreSoir = p.ordreSoir || undefined; if (!p.ordreSoir) delete t.ordreSoir;
  if (p.ordreRetour) t.ordreRetour = p.ordreRetour; else delete t.ordreRetour;
  if (p.retourJour) t.retourJour = p.retourJour; else delete t.retourJour;
  t.ordrePrec = null; return true;
}
function ordreDefaut(t){
  snapOrdre(t); delete t.ordreSoir; delete t.ordreRetour; delete t.retourJour;
}
// ordre des établissements au retour : par défaut l'inverse de l'aller, puis modifiable (t.ordreRetour = liste d'identifiants)
function wdOf(dk){ return new Date((dk || dayKey(new Date())) + "T12:00:00").getDay(); }
// t.retourJour[0..6] = {etabs:[ids], kids:[ids]} : ordre propre à un jour de la semaine (ex. mercredi)
function etabsRetourGen(t){
  if (!Array.isArray(t.ordreRetour)) return t.etabs.slice().reverse();
  const ids = t.etabs.map(e => e.id); const o = t.ordreRetour.filter(id => ids.includes(id));
  return [...o, ...ids.filter(id => !o.includes(id))].map(id => t.etabs.find(e => e.id === id));
}
function etabsRetour(t, dk){
  const ex = t.retourJour?.[wdOf(dk)];
  if (!ex || !Array.isArray(ex.etabs)) return etabsRetourGen(t);
  const ids = t.etabs.map(e => e.id); const o = ex.etabs.filter(id => ids.includes(id));
  return [...o, ...ids.filter(id => !o.includes(id))].map(id => t.etabs.find(e => e.id === id));
}
function kidName(k){ return (k.prenom||"") + (k.nom ? " "+k.nom : ""); }

function telNorm(tel){
  let t = String(tel||"").replace(/[^\d+]/g,"");
  if (/^0\d{9}$/.test(t)) t = "+33" + t.slice(1);
  return t;
}
const isIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
function smsHref(tel, body){ return "sms:" + telNorm(tel) + (isIOS ? "&" : "?") + "body=" + encodeURIComponent(body); }
function telHref(tel){ return "tel:" + telNorm(tel); }
// adresse utilisée pour le GPS : point GPS exact s'il est renseigné, sinon l'adresse
function nav(o){ return ((o && o.gps) || "").trim() || (o && o.adresse) || ""; }
function mapsDirUrl(origin, destination, waypoints){
  const p = new URLSearchParams({ api:"1", travelmode:"driving" });
  if (origin) p.set("origin", origin);
  p.set("destination", destination);
  if (waypoints.length) p.set("waypoints", waypoints.join("|"));
  else p.set("dir_action", "navigate");   // démarre le guidage directement, sans appuyer sur « Démarrer »
  return "https://www.google.com/maps/dir/?" + p.toString();
}
function mapsLinks(addrs){
  let pts = addrs.filter(Boolean);
  pts = pts.filter((a,i) => i === 0 || a.toLowerCase() !== pts[i-1].toLowerCase()); // fratries
  const out = []; let origin = "";
  while (pts.length){
    const chunk = pts.splice(0, 10); const dest = chunk.pop();
    out.push({ url: mapsDirUrl(origin, dest, chunk), n: chunk.length + 1 });

function eligible(t, sens, dk){
  const day = dk || dayKey(new Date());
  if (sens === "midi") return t.enfants.filter(k => dayPlan(k, day).midi === true);   // trajet de midi : enfants prévus à midi ce jour-là
  const list = t.enfants.filter(k => dayPlan(k, day)[sens] === true);
  if (sens === "matin") return list;
  const rev = list.slice().reverse();                        // le soir : ordre inverse du matin…
  const ex = t.retourJour?.[wdOf(day)];
  const ordS = ex && Array.isArray(ex.kids) && ex.kids.length ? ex.kids : t.ordreSoir;
  if (!Array.isArray(ordS) || !ordS.length) return rev;
  const pos = id => { const p = ordS.indexOf(id); return p < 0 ? 1e6 + rev.findIndex(k => k.id === id) : p; };
  return rev.sort((a,b) => pos(a.id) - pos(b.id));          // …ou ordre du soir personnalisé (général, ou propre au jour)
}

function etabRef(a, e){ if (a.sens === "midi") return ""; const h = horaire(e || a.etab, a.start); return a.sens === "soir" ? h.fin : h.debut; }

function altWeekOn(x, dk){   // garde alternée : vrai les semaines concernées

function kidEtab(t, k){ return t.etabs.find(e => e.id === k.etabId) || t.etabs[0]; }
// trajet de midi : récupérer les enfants dans leur(s) établissement(s), puis les déposer à l'établissement d'arrivée
function midiKid(k){ const c = JSON.parse(JSON.stringify(k)); c.adresse = k.midiAdr; c.gps = ""; c.altLabel = k.midiLib || "adresse du midi"; return c; }
function midiDestOf(t, k){   // destination du midi : un établissement, ou une autre adresse
  if (k.midiDest === "adr" && k.midiAdr) return { adr: true };
  return { etab: t.etabs.find(e => e.id === k.midiDest) || t.etabs.find(e => e.id === t.midiDest) || t.etabs[t.etabs.length - 1] };
}
function startMidi(t, kids){
  // 1. récupérer les enfants dans leur établissement (sauf s'il est déjà leur destination)
  const steps = t.etabs.map(e => ({ type:"etab", pickup:true, etab: JSON.parse(JSON.stringify(e)),
    kids: kids.filter(k => { const d = midiDestOf(t, k); return kidEtab(t, k).id === e.id && !(d.etab && d.etab.id === e.id); }).map(k => k.id), at:null })).filter(x => x.kids.length);
  // 2. déposer chacun à sa destination, dans l'ordre des enfants (un arrêt par établissement)
  const seen = {};
  kids.forEach(k => {
    const d = midiDestOf(t, k);
    if (d.adr){ steps.push({ type:"kid", kid: midiKid(k), at:null }); return; }
    if (kidEtab(t, k).id === d.etab.id) return;   // déjà sur place
    if (seen[d.etab.id]) seen[d.etab.id].kids.push(k.id);
    else { seen[d.etab.id] = { type:"etab", pickup:false, etab: JSON.parse(JSON.stringify(d.etab)), kids:[k.id], at:null }; steps.push(seen[d.etab.id]); }
  });
  S.active = { id: uid(), tourneeId:t.id, tourneeNom:t.nom, etab:{...t.etab}, sens:"midi",
    responsable: {...(t.responsable||{})}, remplace: remplActif(t) ? t.remplacement.nom : "",
    start: new Date().toISOString(), steps, kidsRef: kids.map(k => JSON.parse(JSON.stringify(k))),
    absents: eligible(t, "midi").filter(k => !sub.present.includes(k.id)).map(k => kidName(k)) };
  if (S.next && S.next.tourneeId === t.id && S.next.sens === "midi") S.next = null;
  sub = null; save(); render(); window.scrollTo(0,0); keepAwake();
  toast("Trajet de midi lancé à " + hm(S.active.start));
}
function curIndex(){ const a = S.active; return a ? a.steps.findIndex(s => !s.at) : -1; }
function validateStep(i, fromVoice){
  const a = S.active; const s = a.steps[i]; if (!s) return;
  s.at = s.at ? null : new Date().toISOString();
  save(); render();
  if (s.at && !fromVoice) say(stepSpeech(curIndex()));
  if (s.at){
    focusKidStep = s.type === "kid" ? i : null;
    toast((s.type === "kid" ? s.kid.prenom : "Établissement") + " validé à " + hm(s.at));
    setTimeout(() => document.getElementById("step-"+i)?.scrollIntoView({behavior:"smooth", block:"start"}), 60);
    if (curIndex() === -1) setTimeout(() => document.getElementById("step-retour")?.scrollIntoView({behavior:"smooth", block:"center"}), 900);
  }
}
let focusKidStep = null;
let lastEntry = null;
function finishRun(){
  const a = S.active; if (!a) return;
  const end = new Date().toISOString();
  const entry = {
    id: a.id, date: dayKey(a.start), tourneeId: a.tourneeId, tourneeNom: a.tourneeNom, etab: [...new Set(a.steps.filter(s => s.type === "etab").map(s => SE(s, a)?.nom).filter(Boolean))].join(", ") || a.etab?.nom || "",
    sens: a.sens, start: a.start, end, duree: Math.round(minsBetween(a.start, end)),
    nb: a.sens === "midi" ? new Set(a.steps.flatMap(s => s.type === "kid" ? [s.kid.id] : (s.pickup ? [] : (s.kids || [])))).size : a.steps.filter(s => s.type === "kid").length, absents: a.absents || [],
    remplace: a.remplace || "", responsable: a.responsable?.nom || "",
    enfants: a.steps.filter(s => s.type === "kid").map(s => kidName(s.kid)),
    etablissements: [...new Set(a.steps.filter(s => s.type === "etab").map(s => SE(s, a)?.nom).filter(Boolean))],
    etapes: a.steps.map(s => ({ label: s.type === "kid" ? kidName(s.kid) : (SE(s, a)?.nom || "Établissement"), at: s.at })).concat([{ label: "🏠 Retour", at: end }]),
    dernierArret: a.steps[a.steps.length-1]?.at || null,
    retour: a.steps[a.steps.length-1]?.at ? Math.round(minsBetween(a.steps[a.steps.length-1].at, end)) : null
  };
  lastEntry = entry;
  const mk = monthKey(a.start);
  H[mk] = [entry, ...(H[mk]||[])];
  S.active = null; save(); saveHist(mk);
  focusKidStep = null; runReorder = false; handsFree = false; hfPaused = false; stopVoice(); releaseAwake();
  openSheet(`<div style="text-align:center"><div style="font-size:52px">🏁</div><h2>Tournée terminée</h2>
    <p class="muted">${esc(entry.tourneeNom)} · ${sensIcon(entry.sens)} ${sensNom(entry.sens)}</p>
    <div class="timer"><div><span class="small muted">Début</span><b>${hm(entry.start)}</b></div><div><span class="small muted">Fin</span><b>${hm(entry.end)}</b></div><div><span class="small muted">Durée</span><b>${durTxt(entry.duree)}</b></div></div>
    <p class="small muted">Enregistrée dans l'onglet Historique.</p></div>
    ${proposalHtml(entry)}`);
  render();
}

function addDays(dk, n){ const d = new Date(dk+"T12:00:00"); d.setDate(d.getDate()+n); return dayKey(d); }
function dateLong(dk){ const d = new Date(dk+"T12:00:00"); return `${JOURS_LONG[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}`; }
function dateRel(dk){ const t = dayKey(new Date()); if (dk === t) return "aujourd'hui"; if (dk === addDays(t,1)) return "demain"; return dateLong(dk); }
function isSchoolDay(t, dk){
  const d = new Date(dk+"T12:00:00").getDay();
  if (t && hasHoraires(t.etab)){ const h = horaire(t.etab, dk+"T12:00:00"); return !!(h.debut || h.fin); }
  return d !== 0 && d !== 6;
}
function nextSchoolDay(t, fromDk){ let dk = fromDk; for (let i = 0; i < 14; i++){ dk = addDays(dk, 1); if (isSchoolDay(t, dk)) return dk; } return addDays(fromDk, 1); }
function defaultHeure(t, sens, dk){
  if (!t) return sens === "matin" ? "07:30" : "16:30";
  const h = horaire(t.etab, dk+"T12:00:00");
  if (sens === "soir") return h.fin || "16:30";   // le soir : heure de récupération des enfants à l'établissement
  const times = t.enfants.filter(k => k.matin !== false).map(k => effKid(k, dk, "matin").heureMatin).filter(Boolean).sort();
  if (times.length) return times[0];
  if (h.debut){ const m = toMinutes(h.debut) - 60; return p2(Math.floor(m/60))+":"+p2(m%60); }
  return "07:30";
}
// temps entre le départ de chez vous et l'arrivée à l'établissement le soir : moyenne des 5 derniers soirs + 5 min, sinon 30 min
function approachMins(t){
  const ap = Object.values(H).flat().filter(e => e.tourneeId === t?.id && e.sens === "soir" && e.etapes?.[0]?.at).sort((a,b) => a.start < b.start ? 1 : -1).slice(0,5)
    .map(e => minsBetween(e.start, e.etapes[0].at)).filter(m => m > 0 && m < 180);
  return ap.length ? Math.round(ap.reduce((a,b) => a+b, 0) / ap.length) + 5 : 30;
}
function minusMin(hhmm, m){ const x = ((toMinutes(hhmm) - m) % 1440 + 1440) % 1440; return p2(Math.floor(x/60)) + ":" + p2(x%60); }
function toMinutes(v){ const [a,b] = v.split(":").map(Number); return a*60+b; }
function estDuree(n){
  const items = Object.values(H).flat().filter(e => e.tourneeId === n.tourneeId && e.sens === n.sens).sort((a,b) => a.start < b.start ? 1 : -1).slice(0,5);
  if (items.length) return Math.max(15, Math.round(items.reduce((s,e) => s+(e.duree||0), 0) / items.length));
  const t = tour(n.tourneeId); const h = t ? horaire(t.etab, n.date+"T12:00:00") : {};
  if (n.sens === "matin" && h.debut && toMinutes(h.debut) > toMinutes(n.heure)) return toMinutes(h.debut) - toMinutes(n.heure);
  return 60;
}
function gcalStamp(dk, minutes){ const d = new Date(dk+"T00:00:00"); d.setMinutes(minutes); return d.getFullYear()+p2(d.getMonth()+1)+p2(d.getDate())+"T"+p2(d.getHours())+p2(d.getMinutes())+"00"; }
function gcalUrl(n){
  const t = tour(n.tourneeId); const start = toMinutes(n.sens === "soir" && n.depart ? n.depart : n.heure); const dur = estDuree(n);
  const kids = t ? eligible(t, n.sens, n.date) : [];
  const loc = n.sens === "matin" ? (kids[0]?.adresse || t?.etab.adresse || "") : (t?.etab.adresse || "");
  const details = `Tournée du ${n.sens} – ${t?.etab.nom || ""}\nEnfants : ${kids.map(k => k.prenom).join(", ")}\n\n🔔 Alertes souhaitées : 1 h et 30 min avant.`;
  const p = new URLSearchParams({ action:"TEMPLATE", text:`🚐 Tournée ${n.sens === "matin" ? "du matin" : "du soir"} – ${t?.nom || ""}`,
    dates: gcalStamp(n.date, start) + "/" + gcalStamp(n.date, start + dur), ctz:"Europe/Paris", details, location: loc });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}
function proposalHtml(e){
  if (e.sens === "midi") return `<button class="btn primary lg" data-act="close">OK</button>`;
  const t = tour(e.tourneeId);
  let q, sens, dk;
  if (e.sens === "matin"){ sens = "soir"; dk = e.date; const fin = t ? horaire(t.etab, e.date+"T12:00:00").fin : "";
    q = `Faites-vous la tournée du soir aujourd'hui ?`; if (fin) q += `<div class="small muted" style="margin-top:4px">Fin des cours aujourd'hui : ${hTxt(fin)}</div>`; }
  else { sens = "matin"; dk = nextSchoolDay(t, e.date); q = `Faites-vous la tournée de ${dateRel(dk)} matin ?`; }
  return `<div class="card" style="text-align:center;border:2px solid var(--brand)"><h3 style="margin-bottom:12px">${q}</h3>
    <div class="row"><button class="btn go grow" data-act="planYes" data-sens="${sens}" data-date="${dk}">✅ Oui</button>
    <button class="btn grow" data-act="planNo" data-date="${dk}" data-sens="${sens}">✖ Non</button></div>
    <button class="btn sm" style="margin-top:10px" data-act="close">Je ne sais pas encore</button></div>`;
}

  const dp = document.getElementById("pf_dep"); if (dp && recalc) dp.value = minusMin(document.getElementById("pf_h").value || "16:30", approachMins(t));
  const h = dk ? horaire(t.etab, dk+"T12:00:00") : {};
  document.getElementById("pf_info").textContent = dk ? `${dateLong(dk)} – ${t.etab.nom || "établissement"} : ` + ((h.debut||h.fin) ? `cours ${hTxt(h.debut)||"?"} → ${hTxt(h.fin)||"?"}` : "pas d'horaires de cours ce jour-là") : "";
}
function setNext(n){ if (S.next && S.next.event && S.next.date === n.date && S.next.heure === n.heure && (S.next.depart||"") === (n.depart||"")) n.event = S.next.event; S.next = n; save(); render(); agendaSheet(n); }
function eventData(n){
  const t = tour(n.tourneeId); const st = toMinutes(n.heure); const dur = estDuree(n);
  const kids = t ? eligible(t, n.sens, n.date) : [];
  const iso = m => { const d = new Date(n.date+"T00:00:00"); d.setMinutes(m); return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())+"T"+p2(d.getHours())+":"+p2(d.getMinutes())+":00"; };
  return {
    summary: n.sens === "soir" ? `🚐 Tournée du soir – ${n.depart ? "départ " + hTxt(n.depart) + " · " : ""}récupération ${hTxt(n.heure)} – ${t?.nom || ""}` : `🚐 Tournée ${n.sens === "midi" ? "du midi" : "du matin"} – ${t?.nom || ""}`,
    startTime: iso(st), endTime: iso(st + dur),
    location: n.sens === "matin" ? (kids[0]?.adresse || t?.etab.adresse || "") : (t?.etab.adresse || ""),
    description: `Tournée du ${n.sens} – ${t?.etab.nom || ""}\nEnfants : ${kids.map(k => k.prenom).join(", ")}`,
    overrideReminders: [{ method:"popup", minutes:60 }]
  };
}
let mcpNs = null, calBusy = false;
async function createCalEvent(){
  const n = S.next; if (!n || calBusy) return;
  const out = document.getElementById("calMsg");
  const say = (html, ok) => { if (out){ out.innerHTML = html; out.style.color = ok ? "var(--go)" : "var(--warn)"; } };
  if (!mcpNs){ say("La connexion à Google Agenda n'est pas disponible ici : utilisez le lien ci-dessous."); return; }
  calBusy = true; say("Création de l'événement…", true);
  try {
    await mcpNs.callTool("Google Calendar", "create_event", eventData(n));
    n.event = n.date + " " + n.heure; save(); calBusy = false;
    agendaSheet(n); toast("Événement créé ✓");
  } catch(e){
    calBusy = false;
    const c = e?.code;
    if (c === "server_not_connected") say("Google Agenda n'est pas connecté à votre compte Claude (claude.ai → Paramètres → Connecteurs). En attendant, utilisez le lien ci-dessous.");
    else if (c === "needs_reauth") say("La connexion à Google Agenda a expiré : reconnectez-la dans claude.ai → Paramètres → Connecteurs.");
    else if (c === "approval_required" || c === "not_in_manifest" || c === "consent_required") say("Il faut autoriser cette page à utiliser Google Agenda. Ouvrez l'application dans claude.ai et touchez à nouveau le bouton pour accepter.");
    else if (c === "tool_error") say("Google Agenda a refusé l'événement : " + esc(e.message || ""));
    else say("Pas de réponse claire de Google Agenda : l'événement a peut-être été créé. Vérifiez votre agenda avant de réessayer.");
  }
}
async function agendaViaScript(n){
  if (typeof ENDPOINT === "undefined" || typeof code !== "function" || !code()) return { ok:false, why:"nosync" };
  try {
    const ev = eventData(n); const st = new Date(n.date + "T" + (n.sens === "soir" && n.depart ? n.depart : n.heure) + ":00"); const dur = n.sens === "soir" && n.depart ? Math.max(30, estDuree(n)) : estDuree(n);
    const r = await fetch(ENDPOINT, { method:"POST", body: JSON.stringify({ code: code(), agenda: { titre: ev.summary, debut: st.getTime(), fin: st.getTime() + dur * 60000, lieu: ev.location, description: ev.description, rappels: [60] } }) });
    const j = await r.json();
    if (j.ok && j.agenda === "cree") return { ok:true };
    if (j.ok) return { ok:false, why:"oldscript" };
    return { ok:false, why: j.erreur || "erreur" };
  } catch(e){ return { ok:false, why:"reseau" }; }
}
async function agendaStandalone(n){
  const t = tour(n.tourneeId); const done = n.event === n.date + " " + n.heure;
  const head = `<div style="text-align:center"><div style="font-size:46px">📅</div><h2>Prochaine tournée</h2>
    <p style="font-weight:900;font-size:18px;margin:4px 0">${sensIcon(n.sens)} ${dateRel(n.date)} ${sensNom(n.sens)} · ${n.sens === "soir" ? (n.depart ? "départ " + hTxt(n.depart) + " · " : "") + "récupération " : ""}${hTxt(n.heure)}</p><p class="muted" style="margin-top:0">${esc(t?.nom || "")}</p></div>`;
  const ok = `<div class="card" style="background:var(--go-bg);border-color:#bfe3d2;text-align:center"><b style="color:var(--go)">✔ Ajoutée à votre Google Agenda</b><div class="small muted" style="margin-top:4px">avec une alerte 1 heure avant</div></div>`;
  const close = `<button class="btn w100" style="margin-top:8px" data-act="close">Fermer</button>`;
  if (done){ openSheet(head + ok + close); return; }
  openSheet(head + `<p class="muted" style="text-align:center">⏳ Ajout à votre Google Agenda…</p>`);
  const r = await agendaViaScript(n);
  if (r.ok){ n.event = n.date + " " + n.heure; if (S.next) S.next.event = n.event; save(); openSheet(head + ok + close); return; }
  const why = r.why === "oldscript" ? "Le programme Google de votre Drive doit être mis à jour pour pouvoir créer l'événement (voir les instructions de Claude)."
    : r.why === "reseau" ? "Pas de connexion pour le moment." : r.why === "nosync" ? "La synchronisation Google n'est pas configurée sur cet appareil." : "Google a refusé : " + esc(r.why);
  openSheet(head + `<div class="card" style="border-color:#f0c9b5"><b style="color:var(--warn)">L'événement n'a pas pu être créé automatiquement.</b><div class="small" style="margin-top:4px">${why}</div></div>
    <a class="btn go w100" target="_blank" rel="noopener" href="${esc(gcalUrl(n))}">📅 L'ajouter avec Google Agenda</a>
    <p class="small muted">Avec ce lien, ajoutez vous-même la notification « 1 heure avant ».</p>
    <button class="btn w100" data-act="agendaRetry">↻ Réessayer</button>` + close);
}
function agendaSheet(n){
  if (typeof ENDPOINT !== "undefined"){ agendaStandalone(n); return; }
  const t = tour(n.tourneeId);
  const done = n.event === n.date + " " + n.heure;

    <p style="font-weight:900;font-size:18px;margin:4px 0">${n.sens === "matin" ? "☀️" : "🌙"} ${dateRel(n.date)} ${n.sens} · ${hTxt(n.heure)}</p>

/* =========================================================
   Contacts des familles → Google Contacts
   ========================================================= */
const COURT = { "Mère":"Maman", "Père":"Papa", "Grand-mère":"Mamie", "Grand-père":"Papi", "Assistante maternelle / nounou":"Nounou", "Frère / sœur":"Frère Sœur", "Oncle / tante":"Oncle Tante", "Représentant légal":"Représentant", "Tuteur / tutrice":"Tuteur", "Famille d'accueil":"Famille accueil", "Éducateur / référent":"Éducateur", "Grand-parent":"Grand-parent" };
function contactRows(){
  const rows = []; const seen = new Set();
  const kids = S.tournees.flatMap(t => t.enfants.map(k => ({ k, t })));
  const prenomCount = {}; kids.forEach(({k}) => { const p = (k.prenom||"").toLowerCase(); prenomCount[p] = (prenomCount[p]||0) + 1; });
  kids.forEach(({k, t}) => {
    const base = k.prenom + ((prenomCount[(k.prenom||"").toLowerCase()] > 1 && k.nom) ? " " + k.nom : "");
    (k.contacts||[]).filter(c => c.tel).forEach(c => {
      let role = COURT[c.lien] || c.nom || c.lien || "Contact";
      let name = base + " " + role;
      if (seen.has(name.toLowerCase()) && c.nom) name = base + " " + role + " " + c.nom;
      let i = 2; const n0 = name; while (seen.has(name.toLowerCase())) name = n0 + " " + i++;
      seen.add(name.toLowerCase());
      rows.push({ kidId: k.id, name, tel: c.tel, note: `Transport scolaire – ${t.nom}${c.nom ? " – " + c.nom : ""}${c.lien ? " (" + c.lien + ")" : ""} – enfant : ${kidName(k)}` });
    });
  });
  return rows;
}
function contactsCsv(){
  const q = v => '"' + String(v).replace(/"/g,'""') + '"';
  const lines = ["First Name,Last Name,Phone 1 - Label,Phone 1 - Value,Notes,Labels"];
  contactRows().forEach(r => lines.push([q(r.name), q(""), q("Mobile"), q(r.tel), q(r.note), q("* myContacts ::: Transport scolaire")].join(",")));
  return lines.join("\r\n");
}
let dlNs = null;
const STANDALONE = !window.claude;
function vcard(rows){
  const e = v => String(v).replace(/\\/g, "\\\\").replace(/\n/g, "\\n").replace(/([,;])/g, "\\$1");
  return rows.map(r => ["BEGIN:VCARD", "VERSION:3.0", `N:;${e(r.name)};;;`, `FN:${e(r.name)}`, `TEL;TYPE=CELL:${telNorm(r.tel)}`,
    `NOTE:${e(r.note)}`, "CATEGORIES:Transport scolaire", "END:VCARD"].join("\r\n")).join("\r\n") + "\r\n";
}
function saveVcf(rows, name){
  if (!rows.length){ toast("Aucun numéro à ajouter"); return; }
  const blob = new Blob([vcard(rows)], { type: "text/vcard" });
  const u = URL.createObjectURL(blob); const a = document.createElement("a");
  a.href = u; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 30000);
  openSheet(`<div style="text-align:center"><div style="font-size:46px">📇</div><h2>Dernière étape sur le téléphone</h2></div>
    <ol style="padding-left:20px;line-height:1.5">

      <li>Le téléphone propose d'<b>importer</b> le contact : choisissez votre <b>compte Google</b> puis <b>Importer</b> / <b>Enregistrer</b>.</li>
    </ol>
    <p class="small muted">${rows.length} contact${rows.length>1?"s":""} : ${rows.map(r => esc(r.name)).join(", ")}</p>
    <button class="btn w100" data-act="close">OK</button>`);
}
async function exportContacts(){
  const rows = contactRows();
  if (!rows.length){ toast("Aucun numéro de famille enregistré"); return; }
  const csv = "﻿" + contactsCsv();
  if (!dlNs){ downloadBlob(new Blob([csv], { type:"text/csv" }), "contacts-transport-scolaire.csv"); toast("Fichier enregistré dans vos téléchargements ✓"); return; }
  if (dlNs){
    try { await dlNs.save({ filename:"contacts-transport-scolaire.csv", data: csv }); toast("Fichier enregistré ✓"); return; }

}

/* ---------- Tournée en cours ---------- */
let runReorder = false;
// la tournée en cours suit les modifications faites dans la fiche (adresses, contacts, consignes, établissement)
function syncActive(){
  const a = S.active; if (!a) return false;
  const t = tour(a.tourneeId); if (!t) return false;
  let changed = false;
  a.steps.forEach(s => {
    if (s.type !== "kid") return;
    const k = t.enfants.find(x => x.id === s.kid.id);
    const ek = k ? (a.sens === "midi" ? (k.midiDest === "adr" && k.midiAdr ? midiKid(k) : null) : effKid(k, dayKey(a.start), a.sens)) : null;
    if (ek && JSON.stringify(ek) !== JSON.stringify(s.kid)){ s.kid = ek; changed = true; }
  });
  a.steps.forEach(s => {
    if (s.type !== "etab" || !s.etab) return;
    const e = t.etabs.find(x => x.id === s.etab.id);
    if (e && JSON.stringify(e) !== JSON.stringify(s.etab)){ s.etab = JSON.parse(JSON.stringify(e)); changed = true; }
  });
  const e = { ...t.etab };
  if (JSON.stringify(e) !== JSON.stringify(a.etab)){ a.etab = e; changed = true; }
  return changed;
}
// étape qui suit l'étape i (pas encore validée) : adresse + nom, sinon la maison
function nextTarget(i){
  const a = S.active; const j = a.steps.findIndex((s, x) => x !== i && !s.at);
  if (j >= 0){ const s = a.steps[j]; return s.type === "kid" ? { adr: nav(s.kid), nom: s.kid.prenom } : { adr: nav(SE(s, a)), nom: SE(s, a).nom || "l'établissement" }; }
  return S.domicile ? { adr: S.domicile, nom: "la maison" } : null;
}

}

function contactBlock(k, done, heure, i){
  const night = S.active?.sens !== "matin";
  const tplKey = done ? (night ? "valideSoir" : "valideMatin") : (night ? "avantSoir" : "avantMatin");
  const msg = fill(S.tpl[tplKey], k, heure);
  const cs = (k.contacts||[]).filter(c => c.tel);
  if (!cs.length) return `<p class="small muted">Aucun numéro de famille enregistré.</p>`;
  let h = `<div class="msgbox" style="margin-top:10px">${esc(msg)}</div>`;
  cs.forEach(c => {
    h += `<div class="contact"><div class="small" style="font-weight:800">👤 ${esc(contactLabel(c))} · ${esc(c.tel)}</div>
      <div class="row" style="margin-top:6px">
        <a class="btn callf grow" data-href="${esc(telHref(c.tel))}">📞 Appeler</a>
        <a class="btn smsf grow" data-href="${esc(smsHref(c.tel, msg))}">💬 Envoyer le SMS</a>
      </div></div>`;
  });
  h += `<div class="row" style="margin-top:8px"><button class="btn sm" data-act="msgs" data-i="${i}">Autres messages…</button><button class="btn sm" data-act="copy" data-text="${esc(msg)}">📋 Copier</button></div>`;
  return h;
}
function msgsSheet(i){
  const a = S.active; const s = a.steps[i]; const k = s.kid;
  const heure = s.at ? hmInput(s.at) : (k.heureMatin || "");
  const keys = a.sens === "matin" ? ["avantMatin","devant","valideMatin"] : ["avantSoir","devant","valideSoir"];
  const cs = (k.contacts||[]).filter(c => c.tel);
  let h = `<h2>💬 Famille de ${esc(k.prenom)}</h2><p class="small muted" style="margin-top:0">Le SMS s'ouvre dans votre application Messages, prêt à envoyer. Si rien ne s'ouvre, utilisez « Copier ».</p>`;
  keys.forEach(key => {
    const msg = fill(S.tpl[key], k, heure);
    h += `<div class="card"><div class="small muted" style="font-weight:800">${TPL_LABELS[key]}</div><div class="msgbox" style="margin:6px 0">${esc(msg)}</div>

  });
  h += `<div class="card"><div class="small muted" style="font-weight:800">Appeler</div><div class="row" style="margin-top:6px">${cs.map(c => `<a class="btn sm call" data-href="${esc(telHref(c.tel))}">📞 ${esc(contactLabel(c))} · ${esc(c.tel)}</a>`).join("")}</div></div>

  openSheet(h);
}

const WIN = { "€":128,"‚":130,"„":132,"…":133,"‘":145,"’":146,"“":147,"”":148,"•":149,"–":150,"—":151,"œ":156,"Œ":140,"Ÿ":159,"š":154,"Š":138 };
function pdfStr(t){

    let c = ch.codePointAt(0);
    if (WIN[ch]) c = WIN[ch]; else if (c > 255 || (c >= 128 && c < 160)) c = c === 8239 || c === 160 ? 32 : 63;
    if (c === 40 || c === 41 || c === 92) o += "\\" + String.fromCharCode(c);

function txtW(t, size, bold){

function wrap(t, width, size, bold){

  const cands = [];
  U.forEach((l, i) => {
    if (/TVA|\bHT\b|MAX|PRE.?AUTO|AUTORIS|PLAFOND|REMISE|RENDU|\/\s?L\b/.test(l)) return;
    const prio = /MONTANT\s*(REEL|PAYE|DEBITE)|A PAYER|NET A PAYER|\bTTC\b/.test(l) ? 3 : /MONTANT|TOTAL|PAYE|DEBIT|REGLE/.test(l) ? 2 : /€|EUR/.test(l) ? 1 : 0;
    if (!prio) return;
    let xs = [...l.matchAll(/(\d{1,4}\s?[.,]\s?\d{2})(?!\d)/g)].map(x => num(x[1])).filter(v => v >= 1 && v <= 1000);
    if (!xs.length && prio >= 2 && U[i+1]) xs = [...U[i+1].matchAll(/(\d{1,4}[.,]\d{2})(?!\d)/g)].map(x => num(x[1])).filter(v => v >= 1 && v <= 1000);
    xs.forEach(v => cands.push({ v, prio }));
  });
  if (cands.length){ cands.sort((a, b) => b.prio - a.prio || b.v - a.v); r.montant = cands[0].v; }
  // cohérence litres × prix = montant
  if (r.litres != null && r.prixL != null){
    const calc = Math.round(r.litres * r.prixL * 100) / 100;
    if (r.montant == null) r.montant = calc;
    else if (Math.abs(calc - r.montant) > .06){ const ok = cands.find(c => Math.abs(c.v - calc) <= .06); if (ok) r.montant = ok.v; }
  }
  if (r.litres == null && r.montant != null && r.prixL) r.litres = Math.round(r.montant / r.prixL * 100) / 100;
  if (r.prixL == null && r.montant != null && r.litres) r.prixL = Math.round(r.montant / r.litres * 1000) / 1000;
  // carburant
  const carb = [[/ADBLUE/, "AdBlue"], [/HVO/, "HVO100"], [/GAZOLE|GASOIL|GAZOIL|DIESEL|\bB7\b|\bB10\b|\bXTL\b/, "Gazole"], [/E85|SUPERETHANOL|BIOETHANOL/, "E85"],
    [/SP\s?98|PLOMB\s?98|\bE5\b/, "SP98"], [/E10/, "SP95-E10"], [/SP\s?95|SANS\s?PLOMB|\bSP\b/, "SP95"], [/\bGPL\b/, "GPL"]];
  for (const [re, v] of carb) if (re.test(all) && !(v === "AdBlue" && carb.slice(1).some(([r2]) => r2.test(all)))){ r.carburant = v; break; }
  // station : enseigne + ville (ligne « 63000 CLERMONT-FERRAND »)
  const brands = [["TOTALENERGIES","TotalEnergies"],["ESSO","Esso"],["SHELL","Shell"],["\\bBP\\b","BP"],["AVIA","Avia"],["AGIP","Agip"],["\\bENI\\b","Eni"],
    ["INTERMARCHE","Intermarché"],["LECLERC","E.Leclerc"],["CARREFOUR","Carrefour"],["AUCHAN","Auchan"],["SUPER U|HYPER U|SYSTEME U|U EXPRESS|STATION U","Station U"],
    ["CASINO","Casino"],["GEANT","Géant"],["DYNEFF","Dyneff"],["\\bCORA\\b","Cora"],["NETTO","Netto"],["ELAN\\b","Elan"],["VITO","Vito"],["ESTELLE","Estelle"],["TOTAL(?!\\s*(?:TTC|HT|A PAYER|PAYE|:|=|\\d|EUR|€|DU|CB))","TotalEnergies"]];
  const b = brands.find(([re]) => new RegExp(re).test(all));
  m = all.match(/\b(\d{5})\s+([A-Z][A-Z' \-]{2,30})/);
  const ville = m ? m[2].trim().toLowerCase().replace(/(^|[\s\-'])([a-z])/g, (x, p, c) => p + c.toUpperCase()) : "";
  if (b || ville) r.station = [b ? b[1] : "", ville].filter(Boolean).join(" ");
  // kilométrage (souvent demandé par les cartes carburant professionnelles)
  m = all.match(/(?:KILOM[A-Z]*|COMPTEUR|ODOMETRE|\bKMS?\b)\s*[:.=]?\s*(\d[\d .]{1,8}\d)/);
  if (m){ const k = parseInt(m[1].replace(/\D/g, ""), 10); if (k >= 100 && k < 2000000) r.km = k; }
  // immatriculation (format AB-123-CD)
  const fixL = s => s.replace(/0/g, "O").replace(/1/g, "I").replace(/5/g, "S").replace(/8/g, "B");
  const fixD = s => s.replace(/O/g, "0").replace(/[IL]/g, "1").replace(/S/g, "5").replace(/B/g, "8");
  const kw = U.find(l => /IMMAT|IMM\b|PLAQUE|VEHICULE/.test(l));
  m = kw && kw.match(/([A-Z0-9]{2})\s?-?\s?([0-9OILSB]{3})\s?-?\s?([A-Z0-9]{2})\b(?![^\n]*\d{3})/);
  if (!m) m = all.match(/\b([A-Z]{2})-(\d{3})-([A-Z]{2})\b/);
  if (m){ const im = `${fixL(m[1])}-${fixD(m[2])}-${fixL(m[3])}`; if (/^[A-Z]{2}-\d{3}-[A-Z]{2}$/.test(im)) r.immat = im; }
  return r;
}

/* ---------- photos des reçus : sur l'appareil (IndexedDB) + Google Drive ---------- */
const RECUS = {
  p: null,
  open(){ return this.p || (this.p = new Promise((res, rej) => { const q = indexedDB.open("tournee-recus", 1); q.onupgradeneeded = () => q.result.createObjectStore("recus"); q.onsuccess = () => res(q.result); q.onerror = () => rej(q.error); })); },
  async tx(mode, fn){ const d = await this.open(); return new Promise((res, rej) => { const t = d.transaction("recus", mode); const r = fn(t.objectStore("recus")); t.oncomplete = () => res(r && r.result); t.onerror = () => rej(t.error); }); },
  put(k, v){ return this.tx("readwrite", s => s.put(v, k)).catch(() => null); },
  get(k){ return this.tx("readonly", s => s.get(k)).catch(() => null); },
  del(k){ return this.tx("readwrite", s => s.delete(k)).catch(() => null); }
};
async function shrinkPhoto(file, max = 1800){
  const url = URL.createObjectURL(file);
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = url; });
    const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement("canvas"); cv.width = Math.round(img.naturalWidth * k); cv.height = Math.round(img.naturalHeight * k);
    cv.getContext("2d").drawImage(img, 0, 0, cv.width, cv.height);
    return await new Promise(res => cv.toBlob(b => res(b || file), "image/jpeg", .82));
  } catch(e){ return file; } finally { URL.revokeObjectURL(url); }
}
function blobToB64(blob){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(",")[1]); r.onerror = rej; r.readAsDataURL(blob); }); }
function photoName(p){ return `recu-${p.date || "sans-date"}-${(p.station || "station").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "")}-${p.id}.jpg`; }
const hasDrive = () => typeof ENDPOINT !== "undefined" && typeof code === "function" && !!code();
async function uploadPhotos(){
  if (!hasDrive() || uploadPhotos.busy) return;

  try {

    for (const p of tousRecus.filter(x => x.photo && !x.photoDrive)){
      const blob = await RECUS.get(p.id); if (!blob) continue;
      const r = await fetch(ENDPOINT, { method: "POST", body: JSON.stringify({ code: code(), photo: { nom: photoName({ ...p, station: p.station || p.libelle || p.type || "depense" }), type: blob.type || "image/jpeg", data: await blobToB64(blob) } }) });
      const j = await r.json();
      if (!j.ok) break;

      photoScriptOld = false;
      const cur = tousRecus.find(x => x.id === p.id); if (cur){ cur.photoDrive = j.photo; save(); }

async function photoUrl(p){
  let blob = await RECUS.get(p.id);

    try {
      const j = await (await fetch(ENDPOINT + "?code=" + encodeURIComponent(code()) + "&photo=" + encodeURIComponent(p.photoDrive.id))).json();
      if (j.ok && j.data){ const bin = atob(j.data); const u8 = new Uint8Array(bin.length); for (let i = 0; i < bin.length; i++) u8[i] = bin.charCodeAt(i); blob = new Blob([u8], { type: j.type || "image/jpeg" }); RECUS.put(p.id, blob); }
    } catch(e){}
  }
  return blob ? URL.createObjectURL(blob) : "";
}

/* ---------- lecture du texte (Tesseract, chargé seulement quand on en a besoin) ---------- */
let tessP = null;
function loadTess(){
  return tessP || (tessP = new Promise((res, rej) => {
    if (window.Tesseract) return res(window.Tesseract);
    const s = document.createElement("script"); s.src = "https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js";
    s.onload = () => res(window.Tesseract); s.onerror = () => { tessP = null; rej(new Error("chargement")); };
    document.head.appendChild(s);
  }));
}
async function ocrBlob(blob, onProg){
  const T = await loadTess();
  const w = await T.createWorker("fra", 1, { logger: m => { if (m.status === "recognizing text") onProg(m.progress); } });
  try { const { data } = await w.recognize(blob); return data.text || ""; } finally { try { w.terminate(); } catch(e){} }
}

function crepItems(){ return (S.pleins || []).filter(p => (p.date || "").slice(0, 7) === crep.month).sort((a, b) => (a.date + (a.heure || "")).localeCompare(b.date + (b.heure || ""))); }

function crepTot(items){ return { n: items.length, l: items.reduce((a, p) => a + (p.litres || 0), 0), m: items.reduce((a, p) => a + (p.montant || 0), 0) }; }

function crepPdf(){
  const items = crepItems(), t = crepTot(items), rows = crepRows(items);
  const W = 842, Hh = 595, M = 36;
  const cols = [["Date","date",86],["Station","station",150],["Carburant","carb",66],["Véhicule","veh",130],["Km","km",64],["Litres","litres",52],["Prix/L","prix",50],["Montant","montant",70],["Reçu","recu",W-2*M-668]];
  const pages = []; let ops = []; let y;
  const T = (x, yy, s, size = 9, bold = false) => ops.push(`BT /${bold ? "F2" : "F1"} ${size} Tf ${x.toFixed(1)} ${yy.toFixed(1)} Td (${pdfStr(s)}) Tj ET`);
  const header = () => { ops.push(`0.95 0.92 0.84 rg ${M} ${(y-16).toFixed(1)} ${W-2*M} 20 re f 0 g`); let x = M + 4; cols.forEach(([l,,w]) => { T(x, y-10, l, 8.5, true); x += w; }); y -= 22; };
  const newPage = first => {
    if (ops.length) pages.push(ops); ops = []; y = Hh - M;
    if (first){
      T(M, y-14, "Relevé des pleins de carburant", 18, true); y -= 32;
      T(M, y, moisTxt(crep.month).replace(/^./, c => c.toUpperCase()), 11, true); y -= 16;
      if (S.chauffeur){ T(M, y, "Chauffeur : " + S.chauffeur, 10); y -= 14; }
      T(M, y, `${t.n} plein${t.n > 1 ? "s" : ""} — ${fmtN(t.l, 2)} litres — total ${eur(t.m)}`, 10, true); y -= 20;
    } else { T(M, y-8, "Relevé des pleins — " + moisTxt(crep.month) + " (suite)", 9, true); y -= 20; }
    header();
  };
  newPage(true);
  rows.forEach((r, i) => {
    const wr = cols.map(([,k,w]) => wrap(r[k], w - 8, 9));
    const h = Math.max(...wr.map(l => l.length)) * 11 + 7;
    if (y - h < M + 30) newPage(false);
    if (i % 2) ops.push(`0.98 0.97 0.95 rg ${M} ${(y-h+4).toFixed(1)} ${W-2*M} ${h} re f 0 g`);
    let x = M + 4; wr.forEach((ls, c) => { ls.forEach((s, j) => T(x, y - 8 - j*11, s, 9, c === 0 || c === 7)); x += cols[c][2]; });
    y -= h; ops.push(`0.8 G 0.5 w ${M} ${(y+4).toFixed(1)} m ${W-M} ${(y+4).toFixed(1)} l S`);
  });
  y -= 10; if (y < M + 30) newPage(false);
  T(M, y, `Total du mois : ${fmtN(t.l, 2)} L — ${eur(t.m)}`, 11, true);
  if (hasDrive()){ y -= 16; T(M, y, "Photos des reçus : dossier « Ma tournée – reçus » du Google Drive du chauffeur.", 9); }
  pages.push(ops);
  const objs = []; const add = o => { objs.push(o); return objs.length; };
  const fN = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>");
  const fB = add("<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>");
  const pagesId = objs.length + 1 + pages.length * 2; const kids = [];
  const gen = `Édité le ${dFr(dayKey(new Date()))} avec Ma tournée scolaire`;
  pages.forEach((p, i) => {
    const stream = p.join("\n") + `\nBT /F1 8 Tf ${M} 20 Td (${pdfStr(gen)}) Tj ET BT /F1 8 Tf ${W-M-60} 20 Td (${pdfStr(`Page ${i+1} / ${pages.length}`)}) Tj ET`;
    const c = add(`<< /Length ${stream.length} >>\nstream\n${stream}\nendstream`);
    kids.push(add(`<< /Type /Page /Parent ${pagesId} 0 R /MediaBox [0 0 ${W} ${Hh}] /Resources << /Font << /F1 ${fN} 0 R /F2 ${fB} 0 R >> >> /Contents ${c} 0 R >>`));
  });
  add(`<< /Type /Pages /Kids [${kids.map(k => k + " 0 R").join(" ")}] /Count ${kids.length} >>`);
  const cat = add(`<< /Type /Catalog /Pages ${pagesId} 0 R >>`);
  let out = "%PDF-1.4\n"; const off = [];
  objs.forEach((o, i) => { off.push(out.length); out += `${i+1} 0 obj\n${o}\nendobj\n`; });
  const xref = out.length;
  out += `xref\n0 ${objs.length+1}\n0000000000 65535 f \n` + off.map(o => String(o).padStart(10, "0") + " 00000 n \n").join("");
  out += `trailer\n<< /Size ${objs.length+1} /Root ${cat} 0 R >>\nstartxref\n${xref}\n%%EOF`;
  return new Blob([out], { type: "application/pdf" });
}

function renderHist(){
  const months = Object.keys(H).filter(mk => (H[mk]||[]).length).sort().reverse();
  if (!months.includes(histMonth)) months.unshift(histMonth);
  months.sort().reverse();
  const items = (H[histMonth]||[]).slice().sort((a,b) => a.start < b.start ? 1 : -1);
  const tot = items.reduce((s,e) => s + (e.duree||0), 0);
  let h = `<div class="row" style="margin-bottom:12px"><select class="t grow" id="histMonth">${months.map(mk => `<option value="${mk}" ${mk===histMonth?"selected":""}>${moisTxt(mk)}</option>`).join("")}</select>
    <button class="btn" data-act="exportHist" ${items.length?"":"disabled"}>📋 Copier</button></div>
    <button class="btn w100" style="margin-bottom:12px" data-act="manualNew">✍️ Saisir une tournée de dernière minute</button>
    <button class="btn brand w100" style="margin-bottom:12px;padding:13px" data-act="report" ${Object.values(H).some(x => x && x.length) ? "" : "disabled"}>📄 Éditer un relevé pour l'employeur</button>
    <div class="tot"><div><span class="small muted">Tournées</span><b>${items.length}</b></div><div><span class="small muted">Temps total</span><b>${durTxt(tot)}</b></div>
      <div><span class="small muted">☀️ / 🌙</span><b>${items.filter(e=>e.sens==="matin").length} / ${items.filter(e=>e.sens==="soir").length}</b></div></div>`;
  if (!items.length) h += `<div class="card empty muted"><div class="big">🕓</div>Aucune tournée enregistrée ce mois-ci.<br><span class="small">Chaque tournée terminée s'ajoute ici avec son heure de début, de fin et sa durée.</span></div>`;
  let lastDay = "";
  items.forEach(e => {
    const d = new Date(e.start);
    if (e.date !== lastDay){ lastDay = e.date; h += `<div class="small muted" style="font-weight:900;margin:14px 2px 6px;text-transform:capitalize">${JOURS[d.getDay()]} ${d.getDate()} ${MOIS[d.getMonth()]}</div>`; }
    const open = openHist === e.id;
    h += `<div class="card"><div class="hist" data-act="histOpen" data-id="${e.id}">
      <span style="font-size:24px">${sensIcon(e.sens)}</span>
      <div class="grow"><div style="font-weight:900">${esc(e.tourneeNom)}</div><div class="small muted">${hm(e.start)} → ${hm(e.end)} · ${e.nb} enfant${e.nb>1?"s":""}${e.remplace ? " · 🔁 "+esc(e.remplace) : ""}</div></div>
      <span class="dur">${durTxt(e.duree)}</span></div>`;
    if (open){
      h += `<div class="row" style="margin-top:10px"><span class="small muted" style="font-weight:800">Début</span><input type="time" class="tm" data-act="histStart" data-id="${e.id}" value="${hmInput(e.start)}">
        <span class="small muted" style="font-weight:800">Fin</span><input type="time" class="tm" data-act="histEnd" data-id="${e.id}" value="${hmInput(e.end)}"></div>
        ${e.remplace || e.responsable ? `<p class="small" style="margin:8px 0 0">${e.remplace ? "🔁 Remplacement de <b>"+esc(e.remplace)+"</b>" : ""}${e.remplace && e.responsable ? " · " : ""}${e.responsable ? "👔 "+esc(e.responsable) : ""}</p>` : ""}
        ${e.retour != null ? `<p class="small" style="margin:8px 0 0;font-weight:700">Dernier arrêt ${hm(e.dernierArret)} · trajet retour ${durTxt(e.retour)}</p>` : ""}
        <table class="steps">${(e.etapes||[]).map(s => `<tr><td>${esc(s.label)}</td><td>${s.at ? hm(s.at) : "—"}</td></tr>`).join("")}</table>
        ${e.absents?.length ? `<p class="small muted">Absents : ${e.absents.map(esc).join(", ")}</p>` : ""}
        <button class="btn sm danger" style="margin-top:8px" data-act="histDel" data-id="${e.id}">🗑 Supprimer</button>`;
    }
    h += `</div>`;
  });
  return h;
}

function knownAddresses(){
  const set = new Map();
  S.tournees.forEach(t => { (t.etabs || [t.etab]).forEach(e => { if (e.adresse) set.set(e.adresse.toLowerCase(), e.adresse); }); t.enfants.forEach(k => { if (k.adresse) set.set(k.adresse.toLowerCase(), k.adresse); }); });
  return [...set.values()].sort((a,b) => a.localeCompare(b, "fr"));
}
function refreshAddrList(){
  let dl = document.getElementById("addrList");
  if (!dl){ dl = document.createElement("datalist"); dl.id = "addrList"; document.body.appendChild(dl); }
  dl.innerHTML = knownAddresses().map(a => `<option value="${esc(a)}">`).join("");
}
function addrHint(v){
  v = (v||"").trim();
  if (!v) return "";
  if (/^-?\d{1,2}\.\d+\s*,\s*-?\d{1,3}\.\d+$/.test(v)) return "";   // coordonnées GPS : point exact
  if (!/\b\d{5}\b/.test(v)) return "⚠ Ajoutez le code postal pour que Google Maps trouve la bonne adresse.";
  if (!/^\s*\d/.test(v) && !/(lieu-dit|hameau|ferme|chemin|route)/i.test(v)) return "Astuce : indiquez le numéro dans la rue si possible.";
  return "";
}
function mapsSearch(v){ return "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(v||""); }
function gpsField(attr, value){
  return `<details ${value ? "open" : ""} style="margin-top:8px"><summary class="small" style="font-weight:800;cursor:pointer">📍 Le GPS ne va pas au bon endroit ? Destination pour le GPS</summary>

    <p class="small muted" style="margin:4px 0 0">Utilisé à la place de l'adresse pour la navigation (l'adresse reste affichée). Deux possibilités : <b>le nom du lieu</b> tel que Google Maps le connaît (ex. « IME Les Roches Fleuries, Chamalières »), ou <b>le point exact</b> : dans Google Maps, appui long sur l'endroit, puis touchez les chiffres affichés en haut pour les copier et collez-les ici.</p></details>`;
}

}

function planGridHtml(e){
  const t = tour(sub.id); const p = planOf(e);
  const cell = (d, s, lab) => { const c = p[d] || {}; const hk = { matin:"hMatin", midi:"hMidi", soir:"hSoir" }[s];
    const hr = c[hk] || (s === "midi" ? "12:00" : "");
    return `<div><label class="row" style="gap:4px;font-size:14px"><input type="checkbox" data-pc="${d}-${s}" ${c[s] === true ? "checked" : ""}> ${lab}</label>
      <input class="t" type="time" data-ph="${d}-${s}" value="${esc(hr)}" style="padding:6px;font-size:15px;margin-top:4px"></div>`; };
  const rows = JOURS_PLAN.map(d => `<div style="display:grid;grid-template-columns:48px repeat(3,1fr);gap:6px;align-items:start;padding:6px 0;border-bottom:1px solid var(--line)">
    <b style="padding-top:6px">${JOURS_LONG[d].slice(0,3)}.</b>${cell(d,"matin","☀️ Aller")}${t?.midiOn ? cell(d,"midi","🕛 Midi") : "<div></div>"}${cell(d,"soir","🌙 Retour")}</div>`).join("");
  return `<h3 style="margin-top:12px">🗓️ Courses par jour</h3>
    <p class="small muted" style="margin:0 0 4px">Cochez les courses prises chaque jour. Pour une course cochée, indiquez son heure (midi : 12 h par défaut).</p>
    <div>${rows}</div>`;
}
// jours où la grille générale prévoit une course (matin ou soir) : seuls ces jours peuvent porter une adresse alternative
function gridDays(e, s){ const p = e.plan || planOf(e); return JOURS_PLAN.filter(d => p[d]?.[s] === true); }
function readPlan(e){
  const plan = {}; const old = planOf(e);
  JOURS_PLAN.forEach(d => {
    const c = {};
    SESS.forEach(s => {
      const cb = document.querySelector(`[data-pc="${d}-${s}"]`);
      c[s] = cb ? cb.checked : old[d]?.[s] === true;    // midi absent si le trajet de midi n'est pas activé
      const hk = { matin:"hMatin", midi:"hMidi", soir:"hSoir" }[s];
      c[hk] = document.querySelector(`[data-ph="${d}-${s}"]`)?.value || (s === "midi" ? "12:00" : "");
    });
    plan[d] = c;
  });
  return plan;
}
const SESS = ["matin","midi","soir"];
function readKidForm(){
  const g = id => document.getElementById(id)?.value.trim() ?? "";
  const e = editKid;
  e.prenom = g("k_prenom"); e.nom = g("k_nom"); e.adresse = g("k_adresse"); e.gps = g("k_gps");
  if (document.getElementById("k_etab")) e.etabId = document.getElementById("k_etab").value;
  e.comMatin = g("k_comMatin"); e.comSoir = g("k_comSoir"); e.note = g("k_note");
  e.plan = readPlan(e);
  // indicateurs « tous les jours » recalculés à partir de la grille (pour les anciens écrans et l'affichage)
  const any = s => JOURS_PLAN.some(d => e.plan[d][s]);
  e.matin = any("matin"); e.soir = any("soir"); e.midi = any("midi");
  const first = JOURS_PLAN.find(d => e.plan[d].matin && e.plan[d].hMatin);
  e.heureMatin = first !== undefined ? e.plan[first].hMatin : "";
  if (document.getElementById("k_mdest")){ e.midiDest = document.getElementById("k_mdest").value; e.midiLib = g("k_mlib"); e.midiAdr = g("k_madr"); }
  e.contacts = [...document.querySelectorAll("#contacts [data-ci]")].map(r => ({
    nom: r.querySelector("[data-c=nom]").value.trim(),
    lien: r.querySelector("[data-c=lien]").value === "__autre" ? r.querySelector("[data-c=autre]").value.trim() : r.querySelector("[data-c=lien]").value,
    type: r.querySelector("[data-c=type]").value,
    tel: r.querySelector("[data-c=tel]").value.trim() }));
}
function saveKid(){
  readKidForm(); const e = editKid;
  if (!e.prenom){ toast("Le prénom est obligatoire"); return; }
  { const bad = []; (e.altAdr||[]).forEach(x => [["matin","matin"],["soir","soir"]].forEach(([k, s]) => (x[k]||[]).forEach(d => { if (!gridDays(e, s).includes(d)) bad.push(`« ${x.libelle || "Autre adresse"} » : ${JOURS_LONG[d]} ${s} non coché dans « Courses par jour »`); })));
    if (bad.length){ toast(bad[0] + (bad.length > 1 ? ` (+${bad.length-1})` : "")); return; } }
  for (const d of JOURS_PLAN){ const c = e.plan[d];
    if (c.matin && !c.hMatin){ toast(`Indiquez l'heure de ramassage du matin (${JOURS_LONG[d]})`); return; }
    if (c.soir && !c.hSoir){ toast(`Indiquez l'heure du soir (${JOURS_LONG[d]})`); return; } }
  e.contacts = e.contacts.filter(c => c.nom || c.tel);
  const lim = dayKey(new Date(Date.now() - 30*864e5)); e.absences = (e.absences||[]).filter(x => (x.au || x.du) >= lim);
  const t = tour(sub.id);
  if (editKidIndex >= 0) t.enfants[editKidIndex] = e; else t.enfants.push(e);
  syncActive(); save(); closeSheet(); render(); toast("Enregistré ✓");
  const before = JSON.stringify((editKidOrig||[]).map(c => c.tel)), after = JSON.stringify(e.contacts.map(c => c.tel));
  if (STANDALONE && after !== before && e.contacts.some(c => c.tel)){
    openSheet(`<div style="text-align:center"><div style="font-size:42px">📇</div><h2>Ajouter à vos contacts ?</h2>
      <p class="muted">Enregistrer les numéros de la famille de ${esc(e.prenom)} dans les contacts du téléphone (pratique pour « Ok Google, appelle ${esc(e.prenom)} Maman »).</p></div>
      <button class="btn go lg" data-act="vcfKid" data-id="${e.id}">📇 Oui, ajouter à mes contacts</button>
      <button class="btn w100" style="margin-top:8px" data-act="close">Non merci</button>`);
  }
}

function norm(s){ return s.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[’']/g," "); }

/* ---------- annonces vocales ---------- */
let tts = null;
function say(text){
  if (S.annonces === false || !text) return;
  if (tts){ tts.speak(text, { language:"fr" }).catch(()=>{}); return; }
  try { if ("speechSynthesis" in window){ speechSynthesis.cancel(); const u = new SpeechSynthesisUtterance(text); u.lang = "fr-FR"; speechSynthesis.speak(u); } } catch(e){}
}
function stepSpeech(i){
  const a = S.active; const s = a?.steps[i];
  if (!s) return S.domicile ? "Toutes les étapes sont faites. Retour à la maison." : "Toutes les étapes sont faites.";
  if (s.type === "etab") return `Prochaine étape : ${SE(s, a).nom || "l'établissement"}, ${SE(s, a).adresse || ""}.`;
  const k = s.kid; const com = a.sens === "soir" ? k.comSoir : k.comMatin;
  return `Prochaine étape : ${k.prenom}, ${k.adresse || "adresse non renseignée"}.${com ? " Consigne : " + com : ""}`;
}
