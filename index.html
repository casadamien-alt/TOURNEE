/* ---------- actions de tournée partagées (voix + boutons) ---------- */
function markAbsent(i){
  const a = S.active; const s = a?.steps[i]; if (!s || s.type !== "kid" || s.at) return false;
  a.steps.splice(i, 1); a.absents = [...(a.absents||[]), kidName(s.kid)];
  if (focusKidStep === i) focusKidStep = null;
  save(); render(); toast(s.kid.prenom + " retiré(e) de la tournée");
  return s.kid.prenom;
}
function undoLast(){
  const a = S.active; if (!a) return null;
  let best = -1; a.steps.forEach((s, i) => { if (s.at && (best < 0 || s.at >= a.steps[best].at)) best = i; });
  if (best < 0) return null;
  a.steps[best].at = null; save(); render();
  return a.steps[best].type === "kid" ? a.steps[best].kid.prenom : (SE(a.steps[best], a).nom || "l'établissement");
}

/* ---------- interprétation des commandes ---------- */
function voiceCommand(text){
  const t = " " + norm(text) + " "; const a = S.active; if (!a) return;
  const ci = curIndex();
  const has = re => re.test(t);
  const done = (msg, speak) => { heard = msg; renderVoice(); say(speak ?? msg); };
  const offer = (href, label, cls, blank) => {
    voiceAction = `<a class="btn ${cls} w100" href="${esc(href)}" ${blank ? 'target="_blank" rel="noopener"' : ""}>${label}</a>`;
    renderVoice();
    try { const l = document.createElement("a"); l.href = href; if (blank){ l.target = "_blank"; l.rel = "noopener"; } document.body.appendChild(l); l.click(); l.remove(); } catch(e){}
  };
  // enfant nommé dans la phrase
  const kidIdx = a.steps.findIndex(s => s.type === "kid" && s.kid.prenom && t.includes(" " + norm(s.kid.prenom) + " "));
  const isCall = has(/appel|telephon|sonne/), isMsg = has(/message|sms|texto|previen|ecri|j arrive|devant/);
  const t0 = tour(a.tourneeId);
  const resp = (t0 && t0.responsable) || a.responsable || {};
  const rempl = t0?.remplacement || {};
  const remplOn = rempl.actif && rempl.nom && (a.remplace || remplActif(t0));
  const remplFirst = remplOn ? norm(rempl.nom).split(" ")[0] : "§";

  if (has(/\b(silence|tais toi|stop)\b/)){ try { tts?.stop(); } catch(e){} heard = ""; renderVoice(); return; }
  if (has(/commandes|que (puis|peux) je dire|qu est ce que je (peux|dois) dire/)){ heard = ""; renderVoice(); voiceHelpSheet(); return; }
  if (has(/\b(help|aide|secours|urgence)\b/) && !isCall){ heard = ""; voiceAction = null; renderVoice(); helpSheet(); return; }

  if (has(/absent/)){
    const i = kidIdx >= 0 ? kidIdx : (ci >= 0 && a.steps[ci].type === "kid" ? ci : -1);
    if (i < 0) return done("Quel enfant est absent ?", "Quel enfant est absent ? Dites par exemple : Léa absente.");
    if (a.steps[i].at) return done(a.steps[i].kid.prenom + " est déjà validé(e)");
    const p = markAbsent(i); return done(`${p} retiré(e) de la tournée`, `${p} est absent. ${stepSpeech(curIndex())}`);
  }
  if (has(/annul|erreur|retour arriere|pas encore/)){
    const p = undoLast(); return done(p ? `Validation de ${p} annulée` : "Rien à annuler");
  }
  if (has(/combien|reste|ou en (suis|est)|duree/)){
    const r = a.steps.filter(s => !s.at).length; const d = durTxt(minsBetween(a.start, new Date()));
    return done(r ? `${r} étape${r>1?"s":""} restante${r>1?"s":""} · ${d}` : `Toutes les étapes sont faites · ${d}`,
      (r ? `Il reste ${r} étape${r>1?"s":""}.` : "Toutes les étapes sont faites.") + ` La tournée dure depuis ${d.replace(" h ", " heure ").replace("min", "minutes")}.`);
  }
  if (has(/termin|je suis rentre|fin de (la )?tournee|fini/)){
    if (ci === -1){ finishRun(); say("Tournée terminée. Bonne fin de journée."); return; }
    const r = a.steps.filter(s => !s.at).length; return done(`Encore ${r} étape${r>1?"s":""} avant de finir`);
  }
  if (has(/consigne|commentaire|instruction/)){
    const i = kidIdx >= 0 ? kidIdx : ci; const s = a.steps[i];
    if (!s || s.type !== "kid") return done("Pas de consigne pour cette étape");
    const com = a.sens === "soir" ? s.kid.comSoir : s.kid.comMatin;
    return done(com ? `${s.kid.prenom} : ${com}` : `Pas de consigne pour ${s.kid.prenom}`);
  }
  if (has(/navig|gps|itineraire|y aller|guide|route/) && !isCall && !isMsg){
    if (ci < 0){ if (S.domicile) offer(mapsDirUrl("", S.domicile, []), "🧭 Naviguer vers la maison", "go", true); return; }
    const s = a.steps[ci]; const adr = s.type === "kid" ? nav(s.kid) : nav(SE(s, a));
    if (!adr) return done("Adresse manquante pour cette étape");
    offer(mapsDirUrl("", adr, []), `🧭 Naviguer vers ${esc(s.type === "kid" ? s.kid.prenom : (SE(s, a).nom || "l'établissement"))}`, "go", true); return;
  }
  if (has(/prochain|suivante ?\?|c est qui|qui (est|c est) le|adresse/) && !isCall && !isMsg && !has(/valid/)){
    const msg = stepSpeech(ci); return done(msg.replace("Prochaine étape : ", "➡ "), msg);
  }
  if (!isCall && !isMsg && has(/valid|suivant|c est bon|\bok\b|d accord|pris en charge|depose|recupere|monte|arrive a|c est fait/)){
    if (ci < 0) return done("Toutes les étapes sont déjà validées", "Toutes les étapes sont validées. Dites : je suis rentré, pour finir la tournée.");
    const s = a.steps[ci]; const nm = s.type === "kid" ? s.kid.prenom : (SE(s, a).nom || "Établissement");
    const nt = S.autoNav !== false && !S.modeAuto ? nextTarget(ci) : null;
    validateStep(ci, true);
    done(`✔ ${nm} validé(e)`, `${nm}, validé. ${stepSpeech(curIndex())}`);
    if (nt && nt.adr) offer(mapsDirUrl("", nt.adr, []), `🧭 Naviguer vers ${esc(nt.nom)}`, "go", true);
    return;
  }

  if (isCall || isMsg){
    // personne responsable / personne remplacée / établissement
    if (has(/responsable|chef|patron|referent transport/)){
      if (!resp.tel) return done("Pas de numéro pour la personne responsable");
      return isCall ? offer(telHref(resp.tel), `📞 Appeler ${esc(resp.nom || "le responsable")}`, "callf") : offer(smsHref(resp.tel, ""), `💬 SMS à ${esc(resp.nom || "le responsable")}`, "smsf");
    }
    if (remplOn && (has(/remplac/) || t.includes(" " + remplFirst + " "))){
      if (!rempl.tel) return done("Pas de numéro pour la personne remplacée");
      return isCall ? offer(telHref(rempl.tel), `📞 Appeler ${esc(rempl.nom)}`, "callf") : offer(smsHref(rempl.tel, ""), `💬 SMS à ${esc(rempl.nom)}`, "smsf");
    }
    if (has(/ecole|etablissement|\bime\b|college|lycee|centre/) || (a.etab.nom && t.includes(" " + norm(a.etab.nom) + " "))){
      if (!a.etab.tel) return done("Pas de numéro pour l'établissement");
      return offer(telHref(a.etab.tel), `📞 Appeler ${esc(a.etab.nom || "l'établissement")}`, "callf");
    }
    // famille de l'enfant
    let idx = kidIdx >= 0 ? kidIdx : (focusKidStep ?? -1);
    if (idx < 0 && ci >= 0 && a.steps[ci].type === "kid") idx = ci;
    const step = a.steps[idx]; const k = step?.kid;
    if (!k) return done("Pour quel enfant ?", "Pour quel enfant ? Dites par exemple : appeler la maman de Léa.");
    const cs = (k.contacts||[]).filter(c => c.tel);
    if (!cs.length) return done("Pas de numéro pour la famille de " + k.prenom);
    const want = [["mere","maman"],["pere","papa"],["grand mere","mamie","mami"],["grand pere","papi","papy"],["nounou","assistante"],["educ","referent"],["tuteur","tutrice"],["accueil"],["legal","representant"],["frere","soeur"],["oncle","tante"],["voisin"],["travail","bureau"],["fixe","maison"]];
    let c = null;
    for (const ws of want) if (ws.some(w => t.includes(w))){ c = cs.find(x => ws.some(w => norm((x.lien||"")+" "+(x.nom||"")+" "+(x.type||"")).includes(w))); if (c) break; }
    c = c || cs.find(x => x.nom && t.includes(" " + norm(x.nom).split(" ").pop() + " ")) || cs[0];
    const who = contactLabel(c);
    if (isCall && !isMsg) return offer(telHref(c.tel), `📞 Appeler ${esc(who)}`, "callf");
    let key;
    if (has(/devant|suis la/)) key = "devant";
    else if (has(/j arrive|bientot|en route/)) key = a.sens === "soir" ? "avantSoir" : "avantMatin";
    else if (step.at) key = a.sens === "soir" ? "valideSoir" : "valideMatin";
    else key = a.sens === "soir" ? "avantSoir" : "avantMatin";
    const heure = step.at ? hmInput(step.at) : (k.heureMatin || "");
    return offer(smsHref(c.tel, fill(S.tpl[key], k, heure)), `💬 SMS à ${esc(who)}`, "smsf");
  }
  done(`« ${text.trim()} » : je n'ai pas compris`, "Je n'ai pas compris. Touchez le point d'interrogation pour voir les commandes.");
}
/* ---------- mode mains libres : écoute continue + phrase clé ---------- */
let handsFree = false, hfPaused = false, hfBuf = "", hfArmed = false, hfTimer = null;
function wakeRe(){
  let w = norm(S.wake || "ok tournée").trim().replace(/[^a-z0-9 ]/g, " ").replace(/\s+/g, " ");
  w = w.split(" ").map(x => x === "ok" || x === "okay" ? "(?:ok|okay|o k|oke|hockey)" : x).join("[\\s,.!?-]*");
  return new RegExp(w);
}
function hfFinal(text){
  hfBuf = (hfBuf + " " + text).trim();
  const n = norm(hfBuf); const m = n.match(wakeRe());
  if (m){ hfArmed = true; hfBuf = n.slice(m.index + m[0].length).trim(); }
  else if (!hfArmed){ hfBuf = hfBuf.split(" ").slice(-4).join(" "); return; }   // on ne garde que les derniers mots
  heard = "👂 " + (hfBuf || "Je vous écoute…"); renderVoice();
  clearTimeout(hfTimer);
  hfTimer = setTimeout(() => {
    const cmd = hfBuf.trim(); hfBuf = ""; hfArmed = false;
    voiceAction = null;
    if (cmd) voiceCommand(cmd); else { heard = ""; renderVoice(); }
  }, hfBuf ? 900 : 6000);
}
function toggleHandsFree(){
  if (!dict) return;
  if (handsFree && !hfPaused){ handsFree = false; hfArmed = false; hfBuf = ""; dict.stop().catch(()=>{}); heard = ""; renderVoice(); toast("Mains libres désactivé"); return; }
  handsFree = true; hfPaused = false; hfBuf = ""; hfArmed = false; heard = ""; voiceAction = null;
  try { tts?.stop(); } catch(e){}
  dict.start({ language:"fr" }).then(() => toast(`Mains libres activé : dites « ${S.wake || "OK tournée"} » puis la commande`)).catch(err => {
    if (err?.code === "not_granted" || err?.code === "unavailable"){ handsFree = false; toast("Micro indisponible"); }
    else hfPaused = true;
    renderVoice();
  });
  renderVoice();
}
async function initVoice(){
  try { tts = await window.claude?.use?.("tts"); } catch(e){ tts = null; }
  try {
    dict = VOICE_ON ? await window.claude?.use?.("dictation") : null;
    if (!dict) { render(); return; }
    voiceAvailable = true;
    let buffer = "", endTimer = null;
    dict.onPartial(({text}) => {
      if (!text) return;
      if (handsFree){ if (hfArmed || wakeRe().test(norm(hfBuf + " " + text))){ heard = "👂 " + text.trim(); renderVoice(); clearTimeout(hfTimer); } return; }
      heard = (buffer + " " + text).trim(); renderVoice(); clearTimeout(endTimer);
    });
    dict.onFinal(({text}) => {
      if (handsFree){ hfFinal(text); return; }
      buffer = (buffer + text).trim(); heard = buffer; renderVoice();
      // arrêt automatique après une courte pause
      clearTimeout(endTimer); endTimer = setTimeout(() => { if (listening) dict.stop().catch(()=>{}); }, 1200);
    });
    dict.onState(({state, reason}) => {
      listening = state !== "idle";
      if (state === "idle"){
        if (handsFree){
          hfBuf = ""; hfArmed = false;
          if (reason === "unavailable" || reason === "not_granted"){ handsFree = false; voiceAvailable = false; toast("Commande vocale indisponible"); render(); }
          else if (reason !== "stopped"){ hfPaused = true; }       // écran quitté, limite de temps… : reprise d'un toucher
        } else {
          const said = buffer; buffer = "";
          if (said) voiceCommand(said);
          if (reason === "unavailable" || reason === "not_granted"){ voiceAvailable = false; toast("Commande vocale indisponible"); render(); }
        }
      }
      renderVoice();
    });
    render();
  } catch(e){}
}
let micTimer = null;
function toggleMic(){
  if (!dict) return;
  if (handsFree){ toggleHandsFree(); return; }
  if (listening){ dict.stop().catch(()=>{}); return; }
  try { tts?.stop(); } catch(e){}
  heard = ""; voiceAction = null;
  dict.start({ language:"fr" }).catch(err => {
    listening = false;
    if (err?.code === "unavailable"){ dict.start().catch(()=>{ voiceAvailable = false; render(); }); return; }
    if (err?.code === "not_granted"){ voiceAvailable = false; toast("Micro refusé"); render(); }
  });
  clearTimeout(micTimer); micTimer = setTimeout(() => { if (listening) dict.stop().catch(()=>{}); }, 8000);
}

    const key = t.dataset.act === "histStart" ? "start" : "end";
    const d = new Date(en[key]); const [hh,mm] = t.value.split(":").map(Number); d.setHours(hh, mm, 0, 0);
    en[key] = d.toISOString(); en.duree = Math.max(0, Math.round(minsBetween(en.start, en.end)));
    saveHist(mk); render(); toast("Horaire corrigé"); return;
  }
  if (t.id === "ret_jour"){ retourSel = t.value; render(); return; }
  if (t.id === "k_heure"){ const a = document.getElementById("alt_heure"); if (a && (!a.value || a.value === a.dataset.gen)) a.value = t.value; if (a) a.dataset.gen = t.value; return; }
  if (t.id === "depCam" || t.id === "depGal"){ const f = t.files && t.files[0]; t.value = ""; depPhoto(f); return; }
  if (t.id === "ptg_nom"){ S.chauffeur = t.value.trim(); save(); return; }
  if (t.id === "sim_date" && t.value){ sim.date = t.value; simSheet(); return; }
  if (t.id === "sim_sens"){ sim.sens = t.value; simSheet(); return; }
  if (t.id === "carbuCam" || t.id === "carbuGal"){ const f = t.files && t.files[0]; t.value = ""; plFromFile(f); return; }
  if (t.id === "carbuMonth"){ carbuMonth = t.value; render(); return; }
  if (t.id === "crep_month"){ crep.month = t.value; carbuReportSheet(); return; }
  if (t.id === "pl_litres" || t.id === "pl_prix" || t.id === "pl_montant"){ plAutoCalc(t.id); ["pl_litres","pl_prix","pl_montant"].forEach(i => unVide(document.getElementById(i))); return; }
  if (t.id && t.id.startsWith("pl_")) unVide(t);
  if (t.id === "pl_veh"){ const vh = (S.vehicules || []).find(v => v.nom === t.value); const im = document.getElementById("pl_immat"); if (vh && vh.immat && im){ im.value = vh.immat; unVide(im); } return; }
  if (t.id === "histMonth"){ histMonth = t.value; openHist = null; render(); return; }
  if (t.id === "rep_month"){ rep.month = t.value; reportSheet(); return; }
  if (t.id === "rep_week"){ if (t.value) rep.week = t.value; reportSheet(); return; }
  if (t.dataset.repday){ const d = t.dataset.repday; rep.days = t.checked ? [...new Set([...rep.days, d])] : rep.days.filter(x => x !== d); const sc = t.closest("div[style*=overflow]")?.scrollTop; reportSheet(); const box = document.querySelector(".sheet div[style*=overflow]"); if (box && sc) box.scrollTop = sc; return; }
  if (t.dataset.pick){ t.closest(".pick").classList.toggle("off", !t.checked); updatePickup(); return; }
  if (t.id === "cf_h"){ const d = document.getElementById("cf_d"); if (d && t.value) d.value = minusMin(t.value, Number(d.dataset.appro) || 30); return; }
  if (t.id === "pf_h"){ const d = document.getElementById("pf_dep"); if (d && t.value) d.value = minusMin(t.value, approachMins(tour(document.getElementById("pf_t").value))); return; }
  if (t.id === "pf_t" || t.id === "pf_d" || t.id === "pf_s"){ updatePlanInfo(true); return; }
  if (t.dataset.hor){
    const [ei, d, k] = t.dataset.hor.split("."); const e2 = tour(sub.id).etabs[Number(ei)];
    e2.horaires[d] = Object.assign({debut:"",fin:""}, e2.horaires[d]||{}); e2.horaires[d][k] = t.value; save(); return;
  }
  if (t.id === "k_mdest"){ document.getElementById("k_madrbox").style.display = t.value === "adr" ? "" : "none"; return; }
  if (t.dataset.etabpick !== undefined && t.value !== ""){
    const tr = tour(sub.id); const ei = Number(t.dataset.etabpick);
    const kn = knownEtabs().filter(x => !tr.etabs.some(y => etabKey(y) === etabKey(x)));
    const src = kn[Number(t.value)]; if (!src) return;
    const dst = tr.etabs[ei];
    ["nom","adresse","gps","tel","entree","codeBarriere"].forEach(f => dst[f] = src[f] || "");
    dst.resp = JSON.parse(JSON.stringify(src.resp || {}));
    dst.horaires = JSON.parse(JSON.stringify(src.horaires || {}));
    linkEtabs(tr); save(); render(); toast(`${src.nom || "Établissement"} repris ✓ (horaires compris)`); return;
  }
  if (t.dataset.tf){
    const tr = tour(sub.id); const path = t.dataset.tf.split(".");
    const val = t.type === "checkbox" ? t.checked : t.value.trim();
    let o = tr; for (let x = 0; x < path.length - 1; x++){ const key = /^\d+$/.test(path[x]) ? Number(path[x]) : path[x]; o[key] = o[key] || {}; o = o[key]; }
    o[path[path.length-1]] = val;
    save(); if (t.type === "checkbox" || t.dataset.tf === "dateUnique") render(); return;
  }
  if (t.dataset.setb){ S[t.dataset.setb] = t.checked; save(); toast(t.checked ? "Activé" : "Désactivé"); return; }
  if (t.dataset.set){ S[t.dataset.set] = t.value.trim(); save(); toast("Enregistré ✓"); if (t.dataset.set === "domicile") render(); return; }
  if (t.dataset.tpl){ S.tpl[t.dataset.tpl] = t.value; save(); toast("Enregistré ✓"); return; }
});

// chronomètre de la tournée en cours
setInterval(() => { const el = document.getElementById("elapsed"); if (el && S.active) el.textContent = durTxt(minsBetween(S.active.start, new Date())); }, 15000);

render();
connectDb();
initVoice();
(async () => { try { mcpNs = await window.claude?.use?.("mcp"); } catch(e){} try { dlNs = await window.claude?.use?.("downloads"); } catch(e){} })();
</script>
